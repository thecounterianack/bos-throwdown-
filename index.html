tion:none}.report{position:fixed;z-index:90;bottom:4px;left:0;right:0;text-align:center;font-size:9px;color:#afbbcf}.weapon{color:#f4bd2a}

<script>
'use strict';
const AS='assets/', AU='audio/';
const roster=[
{id:'tmoney',name:'T MONEY',r:1,hp:100,spd:5,reach:76,light:6,heavy:11,ai:.28,weapon:'CD',special:'SPINNING CD'},
{id:'sikotik',name:'SIKOTIK',r:2,hp:100,spd:6,reach:72,light:7,heavy:10,ai:.33,weapon:'VAPE',special:'VAPOR BLAST'},
{id:'ryan',name:'RYAN THE BROADCASTER',r:3,hp:105,spd:5,reach:78,light:6,heavy:11,ai:.37,weapon:'MIC',special:'BROADCAST BASH'},
{id:'brayden',name:'BRAYDEN B.O.S.',r:4,hp:107,spd:6,reach:75,light:7,heavy:11,ai:.42,weapon:'MIC',special:'B.O.S. MIC DROP'},
{id:'bcthekid',name:'B.C. THE KID',r:5,hp:108,spd:6,reach:74,light:7,heavy:11,ai:.46,weapon:'BAT',special:'HOME RUN'},
{id:'ali3nlee',name:'ALI3N LEE',r:6,hp:112,spd:6,reach:77,light:8,heavy:12,ai:.52,weapon:'ENERGY BLASTER',special:'ALI3N SHOT'},
{id:'xackley',name:'X-ACKLEY',r:8,hp:118,spd:6,reach:81,light:8,heavy:13,ai:.58,weapon:'KATANA',special:'RECORDED SLASH'},
{id:'tsspectre',name:'T.S. THE SPECTRE',r:9,hp:122,spd:7,reach:83,light:8,heavy:13,ai:.64,weapon:'SCYTHE',special:'GRAVE BAR'},
{id:'wraith',name:'WRAITH',r:10,hp:140,spd:7,reach:87,light:10,heavy:16,ai:.78,weapon:'CHAIN SCYTHE',special:'CARRY THE CREW'}];
const shadows=[
{id:'shadowx',name:'SHADOW X-ACKLEY',hp:155,spd:8,reach:89,light:11,heavy:17,ai:.87,weapon:'CORRUPTED KATANA',special:'RAGE SLASH',shadow:true},
{id:'shadowtsspectre',name:'SHADOW T.S. SPECTRE',hp:165,spd:8,reach:92,light:12,heavy:18,ai:.92,weapon:'CORRUPTED SCYTHE',special:'DARK TRACK',shadow:true},
{id:'shadowwraith',name:'SHADOW WRAITH',hp:180,spd:9,reach:96,light:13,heavy:20,ai:.98,weapon:'MASSIVE CHAIN SCYTHE',special:'FINAL CARRY',shadow:true}];
const img=new Map(),missing=[];let songs={menu:new Audio(AU+'song3.mp3'),intro:new Audio(AU+'song1.mp3'),boss:new Audio(AU+'song2.mp3')},curSong=null,sound=true,audioUnlocked=false;
Object.values(songs).forEach(a=>{a.preload='auto';a.volume=.57;a.loop=true});
function path(id,p){return AS+id+'_'+p+'.jpeg'}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on')}
function makeSkull(){let s=document.getElementById('skull');let cells=[[5,0],[6,0],[7,0],[8,0],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1],[10,1],[2,2],[3,2],[4,2],[5,2],[6,2],[7,2],[8,2],[9,2],[10,2],[11,2],[2,3],[3,3],[4,3],[5,3],[6,3],[7,3],[8,3],[9,3],[10,3],[11,3],[2,4],[3,4],[4,4],[9,4],[10,4],[11,4],[3,5],[4,5],[5,5],[6,5],[7,5],[8,5],[9,5],[10,5],[4,6],[5,6],[6,6],[7,6],[8,6],[9,6],[4,7],[5,7],[6,7],[7,7],[8,7],[9,7],[5,8],[6,8],[7,8],[8,8],[5,9],[6,9],[7,9],[8,9]];cells.forEach(([x,y])=>{let e=document.createElement('i');e.style.left=x*14+'px';e.style.top=y*14+'px';if((x===4||x===5)&&y===3||((x===8||x===9)&&y===3))e.className='eye';if((x===6||x===7)&&y===4)e.className='dark';s.appendChild(e)})}
async function preload(){const list=[];[...roster,...shadows].forEach(f=>['front','side','back','profile'].forEach(p=>list.push({t:'i',u:path(f.id,p)})));Object.values(songs).forEach(a=>list.push({t:'a',a}));let n=0;const tick=()=>{n++;loadFill.style.width=(n/list.length*100)+'%';loadPct.textContent=Math.round(n/list.length*100)+'%'};await Promise.all(list.map(x=>new Promise(resolve=>{if(x.t==='i'){let im=new Image();im.onload=()=>{img.set(x.u,im);tick();resolve()};im.onerror=()=>{missing.push(x.u);tick();resolve()};im.src=x.u}else{x.a.oncanplaythrough=()=>{tick();resolve()};x.a.onerror=()=>{missing.push(x.a.src);tick();resolve()};x.a.load();setTimeout(()=>{if(x.a.readyState<2){tick();resolve()}},9000)}})));if(missing.length){loadText.textContent='SOME OPTIONAL POSES ARE MISSING — FRONT-POSE FALLBACK ENABLED';loadError.textContent=missing.map(x=>x.split('/').pop()).join(' · ')}else loadText.textContent='THE LOT IS READY';setTimeout(()=>{show('title');titleMeta();music('menu',0)},800)}
function music(k,time){if(!sound)return;Object.entries(songs).forEach(([id,a])=>{if(id!==k)a.pause()});let a=songs[k];if(curSong===k&&!a.paused)return;curSong=k;if(typeof time==='number')try{a.currentTime=time}catch(e){}a.play().catch(()=>{status.textContent='TAP SCREEN ONCE TO ENABLE AUDIO'})}function stopMusic(){Object.values(songs).forEach(a=>a.pause())}function unlock(){if(audioUnlocked)return;audioUnlocked=true;Object.values(songs).forEach(a=>{let was=a.paused;a.play().then(()=>{if(was){a.pause();a.currentTime=0}}).catch(()=>{})});if(curSong&&sound)songs[curSong].play().catch(()=>{})}
let state='title',cursor=0,pick=null,ladder=[],rung=0,gate=false,game=null,last=0,gpIndex=null;const keys={left:false,right:false,jump:false,crouch:false,block:false,punch:false,kick:false,special:false};let prev={};
function titleMeta(){let c=+localStorage.getItem('bosClears')||0;meta.textContent=`TOWER CLEARS: ${c} · SHADOW TIER ${Math.min(3,c)}/3 · FIGHTERS ARE ${c*5}% HARDER`}
function gateStart(x,y){if(state!=='title'||gate)return;gate=true;unlock();cracks.style.setProperty('--x',x+'px');cracks.style.setProperty('--y',y+'px');cracks.classList.add('on');gateEl.classList.add('on');setTimeout(()=>{cracks.classList.remove('on');gateEl.classList.remove('on');gate=false;startSelect()},1400)}
const gateEl=document.getElementById('gate');title.addEventListener('pointerdown',e=>gateStart(e.clientX,e.clientY));
function startSelect(){state='select';show('select');cursor=0;pick=null;drawGrid();music('menu',0)}
function drawGrid(){grid.innerHTML='';roster.forEach((f,i)=>{let b=document.createElement('button');b.className='card '+(i===cursor?'focus':'')+(pick&&pick.id===f.id?' selected':'');b.innerHTML=`<em>RUNG ${f.r}</em><img src="${path(f.id,'front')}"><span>${f.name}</span>`;b.onclick=()=>{cursor=i;choose(false);drawGrid()};grid.appendChild(b)});let f=roster[cursor];stats.innerHTML=`<div class="statname">${f.name}</div>HP ${f.hp} · SPD ${f.spd} · REACH ${f.reach}<div class="bar"><i style="width:${f.hp/1.8}%"></i></div>LIGHT ${f.light} · HEAVY ${f.heavy} · <span class="weapon">SPECIAL: ${f.weapon}</span>`}
function choose(confirm){let f=roster[cursor];if(!pick||pick.id!==f.id){pick=f;drawGrid();return}if(confirm){ladder=roster.map(x=>x.id===pick.id?{...x,id:'mirror_'+x.id,mirror:true,sourceId:x.id,name:x.name+' MIRROR',shadow:true}:x);rung=0;showVS()}}
lock.onclick=()=>choose(true);
function pose(f,p){let id=f.mirror?f.sourceId:f.id;return img.get(path(id,p))||img.get(path(id,'front'))}function showVS(){state='vs';show('vs');let foe=ladder[rung];pFace.src=path(pick.id,'profile');eFace.src=path(foe.mirror?foe.sourceId:foe.id,'profile');pName.textContent=pick.name;eName.textContent=foe.shadow?'??? ??? ???':foe.name;rungEl.textContent=`RUNG ${rung+1} OF ${ladder.length}`;tauntEl.textContent=foe.mirror?'YOU AGAINST EVERYTHING YOU TRY NOT TO SEE.':foe.name==='WRAITH'?'I CARRY EVERYTHING IN THIS CREW. TONIGHT THAT INCLUDES YOU.':`SPECIAL WEAPON: ${foe.weapon}`;music('menu',0)}const rungEl=document.getElementById('rung'),tauntEl=document.getElementById('taunt');begin.onclick=()=>{if(rung===0)startIntro();else startFight()};
const cards=[[0,'CARL JUNG CALLED IT THE SHADOW.','The unknown dark side of the personality. The part of you nobody asked you to approve.'],[11,'INSTINCTIVE. IRRATIONAL.','It takes what you cannot stand about yourself and goes looking for it in somebody else.'],[19,"THAT'S CALLED PROJECTION.",'Every fight that ever started in this lot started right there.'],[26,'A VEIL THAT KEEPS THICKENING.','Your ego on one side. The real world on the other. Everybody carries one.'],[35,'THE LESS YOU LIVE WITH IT,','the blacker and denser it gets. Jung wrote that. He never had to prove it in a parking lot.'],[44,'SO WE DON’T RUN FROM OURS.','That is why they call us the BROTHERS OF SHADOW.'],[51,'WE FIGHT THE DEMON HEAD ON.','The demon fights back. It always fights back. You never get fully rid of it.'],[60,'EVERYBODY HAS A SHADOW.','Accept that and you get accepted in. Nine deep, one leader, and the leader gets decided tonight.'],[68,'THEY TRY TO SHORTEN MY LIFESPAN.','I never wanted the fight. It came my way anyway. So I stand my ground.']];let introStart=0,introIdx=-1;function startIntro(){state='intro';show('intro');stopMusic();songs.intro.loop=false;songs.intro.currentTime=0;songs.intro.play().catch(()=>{});introStart=performance.now();introIdx=-1;requestAnimationFrame(introLoop)}function introLoop(){if(state!=='intro')return;let sec=(performance.now()-introStart)/1000,idx=0;for(let i=0;i<cards.length;i++)if(sec>=cards[i][0])idx=i;if(idx!==introIdx){introIdx=idx;introA.textContent=cards[idx][1];introB.textContent=cards[idx][2]}introProgress.style.width=Math.min(100,sec/75*100)+'%';if(sec>=75){finishIntro();return}requestAnimationFrame(introLoop)}function finishIntro(){if(state!=='intro')return;state='transition';startFight(true)}skip.onclick=finishIntro;
function fighter(data,x,face,cpu){return{d:data,x,y:0,face,cpu,hp:data.hp,max:data.hp,meter:0,st:'idle',t:0,vx:0,vy:0,air:false,flash:0,hit:false,ai:300,weaponT:0,wins:0}}
function startFight(fromIntro=false){state='fight';show('fight');hud.classList.add('on');let foe=ladder[rung];game={p1:fighter(pick,.24,1,false),p2:fighter(foe,.76,-1,true),timer:90,round:1,ready:2200,over:false,last:performance.now(),fromIntro};n1.textContent=pick.name;n2.textContent=foe.shadow?'??? ??? ???':foe.name;msg.textContent='ROUND 1';msg.className='msg red';if(!fromIntro)music(foe.name==='WRAITH'||foe.shadow?'boss':'menu',0);setTimeout(()=>{if(game&&!game.over){msg.textContent='FIGHT';setTimeout(()=>{if(game)msg.textContent=''},550)}},1100);requestAnimationFrame(loop)}
function startMove(f,type,o){if(f.t||f.st==='ko'||f.st==='hit')return;if(type==='special'&&f.meter<100)return;f.st=type;f.t=type==='punch'?260:type==='kick'?380:620;f.hit=false;if(type==='special'){f.meter=0;f.weaponT=620}let active=type==='punch'?90:type==='kick'?150:220;setTimeout(()=>{if(!game||f.st!==type||f.hit)return;f.hit=true;let range=f.d.reach*(type==='special'?1.55:type==='kick'?1.18:1),dist=Math.abs(f.x-o.x)*960;if(dist>range)return;let dmg=type==='punch'?f.d.light:type==='kick'?f.d.heavy:Math.round(f.d.heavy*1.85);if(o.st==='block')dmg=Math.max(1,Math.round(dmg*.18));o.hp=Math.max(0,o.hp-dmg);o.meter=Math.min(100,o.meter+dmg*.65);o.flash=180;o.st=o.hp?'hit':'ko';o.t=o.hp?280:99999;o.vx=o.x<f.x?-0.018:0.018;if(type==='punch')f.meter=Math.min(100,f.meter+9);if(type==='kick')f.meter=Math.min(100,f.meter+15)},active)}
function input(f){if(f.st==='ko'||f.st==='hit'||f.t)return;let dir=(keys.left?-1:0)+(keys.right?1:0);if(keys.jump&&!f.air){f.air=true;f.vy=-.0017;f.st='jump'}if(keys.crouch){f.st='crouch';return}if(keys.block){f.st='block';return}if(edge('punch'))startMove(f,'punch',game.p2);else if(edge('kick'))startMove(f,'kick',game.p2);else if(edge('special'))startMove(f,'special',game.p2);else{f.st=dir?'walk':'idle';f.x+=dir*f.d.spd*.00014}}
function ai(f,o,dt){if(f.t||f.st==='ko'||f.st==='hit')return;f.ai-=dt;if(f.ai>0)return;let dist=Math.abs(f.x-o.x)*960;f.ai=120+Math.random()*300;if(dist>f.d.reach*.85){f.x+=(o.x>f.x?1:-1)*f.d.spd*.00016;f.st='walk'}else{let r=Math.random();if(r<.18)f.st='block';else if(f.meter>=100&&r<.34)startMove(f,'special',o);else if(r<.66)startMove(f,'punch',o);else startMove(f,'kick',o)}}
function updateF(f,o,dt){if(f.flash>0)f.flash-=dt;if(f.weaponT>0)f.weaponT-=dt;if(f.t>0){f.t-=dt;if(f.t<=0&&f.st!=='ko')f.st='idle'}if(f.st==='hit'){f.t-=dt;f.x+=f.vx*dt;f.vx*=.92;if(f.t<=0)f.st='idle'}if(f.air){f.y+=f.vy*dt;f.vy+=.000005*dt;if(f.y>=0){f.y=0;f.vy=0;f.air=false;if(f.st==='jump')f.st='idle'}}f.x=Math.max(.06,Math.min(.94,f.x));f.face=o.x>f.x?1:-1}
function edge(k){return keys[k]&&!prev[k]}
function loop(t){if(state!=='fight'||!game)return;let dt=Math.min(40,t-game.last);game.last=t;if(!game.over){if(game.ready>0)game.ready-=dt;else{game.timer-=dt/1000;input(game.p1);ai(game.p2,game.p1,dt);updateF(game.p1,game.p2,dt);updateF(game.p2,game.p1,dt);if(game.p1.hp<=0||game.p2.hp<=0||game.timer<=0)endRound(game.p1.hp>=game.p2.hp?game.p1:game.p2)}}Object.keys(keys).forEach(k=>prev[k]=keys[k]);draw();requestAnimationFrame(loop)}
function endRound(w){if(game.over)return;game.over=true;w.wins++;msg.textContent=w.d.name+' WINS ROUND';msg.className='msg red';setTimeout(()=>{if(w.wins>=2)endMatch(w);else{game.round++;game.p1=fighter(pick,.24,1,false);game.p2=fighter(ladder[rung],.76,-1,true);game.timer=90;game.over=false;game.ready=1600;msg.textContent='ROUND '+game.round}},1500)}function endMatch(w){hud.classList.remove('on');state='win';show('win');let won=w===game.p1,foe=ladder[rung];winTitle.textContent=won?pick.name+' WINS':foe.name+' HOLDS THE RUNG';winSub.textContent=won?'SPECIAL MOVE UNLOCKED: '+pick.special:'RUN THE LADDER AGAIN';winText.textContent=won?'ONE DOWN. KEEP CLIMBING.':'THE LOT REMEMBERS. COME BACK READY.';continue.textContent=won&&rung<ladder.length-1?'NEXT FIGHT':'RETURN TO TITLE';continue.onclick=()=>{if(won&&rung<ladder.length-1){rung++;showVS()}else if(won){localStorage.setItem('bosClears',(+localStorage.getItem('bosClears')||0)+1);goTitle()}else goTitle()};music('menu',0)}
function draw(){let c=canvas,ctx=c.getContext('2d'),W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight;ctx.clearRect(0,0,W,H);let floor=H*.79,g=ctx.createLinearGradient(0,0,0,floor);g.addColorStop(0,'#0c101c');g.addColorStop(1,'#20283b');ctx.fillStyle=g;ctx.fillRect(0,0,W,floor);ctx.fillStyle='#070a11';ctx.fillRect(0,floor,W,H-floor);for(let x=0;x<W;x+=65){ctx.strokeStyle='#263149';ctx.globalAlpha=.3;ctx.beginPath();ctx.moveTo(x,floor);ctx.lineTo(W/2+(x-W/2)*.2,H);ctx.stroke()}ctx.globalAlpha=1;if(!game)return;drawF(game.p1,floor,W,H,ctx);drawF(game.p2,floor,W,H,ctx);hp1.style.width=game.p1.hp/game.p1.max*100+'%';hp2.style.width=game.p2.hp/game.p2.max*100+'%';m1.style.width=game.p1.meter+'%';m2.style.width=game.p2.meter+'%';clock.textContent=Math.max(0,Math.ceil(game.timer));}
function drawF(f,floor,W,H,ctx){let fullH=Math.min(H*.48,W*.32),fullW=fullH*.72,x=f.x*W,y=floor+f.y*H,lean=f.st==='walk'?Math.sin(performance.now()/95)*5:0,att=f.st==='punch'?fullW*.22:f.st==='kick'?fullW*.27:f.st==='special'?fullW*.42:0;ctx.save();ctx.translate(x,y);ctx.scale(f.face,1);ctx.globalAlpha=f.flash>0?.48:1;ctx.fillStyle='rgba(0,0,0,.42)';ctx.beginPath();ctx.ellipse(0,5,fullW*.45,8,0,0,Math.PI*2);ctx.fill();let col=f.d.shadow?'#df2532':'#b8c6dc';ctx.strokeStyle=col;ctx.lineWidth=Math.max(3,fullW*.045);ctx.lineCap='round';let hip=-fullH*.28,sh=-fullH*.72;ctx.beginPath();ctx.moveTo(-fullW*.12,hip);ctx.lineTo(-fullW*.18,0);ctx.moveTo(fullW*.12,hip);ctx.lineTo(fullW*(f.st==='kick'?.50:.18),0);ctx.moveTo(-fullW*.18,sh);ctx.lineTo(-fullW*.27,sh+fullH*.25);ctx.moveTo(fullW*.18,sh);ctx.lineTo(fullW*.25+att,sh+fullH*(f.st==='special'?-0.02:.25));ctx.stroke();let im=pose(f.d,f.st==='walk'||f.st==='punch'||f.st==='kick'||f.st==='special'?'side':f.st==='block'?'back':'front');if(im&&im.complete){let ar=im.naturalWidth/im.naturalHeight,dw=Math.min(fullW*1.45,fullH*ar);ctx.drawImage(im,-dw/2+lean+att*.22,-fullH,dw,fullH)}else{ctx.fillStyle=f.d.shadow?'#59121b':'#39445c';ctx.fillRect(-fullW*.24,-fullH,fullW*.48,fullH)}if(f.weaponT>0){ctx.save();ctx.globalAlpha=.8;ctx.shadowColor=f.d.shadow?'#ff2030':'#f3bd2a';ctx.shadowBlur=18;ctx.strokeStyle=f.d.shadow?'#ff3040':'#f3bd2a';ctx.lineWidth=fullW*.07;ctx.beginPath();if(/SCYTHE/.test(f.d.weapon)){ctx.moveTo(fullW*.18,-fullH*.58);ctx.lineTo(fullW*.85,-fullH*.95);ctx.arc(fullW*.78,-fullH*.96,fullW*.28,.1,2.3)}else if(/CD/.test(f.d.weapon)){ctx.arc(fullW*.75,-fullH*.62,fullW*.16,0,Math.PI*2)}else if(/VAPE/.test(f.d.weapon)){for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(fullW*(.42+i*.12),-fullH*(.65+i*.04),fullW*.13,0,Math.PI*2);ctx.stroke()}}else if(/BLASTER/.test(f.d.weapon)){ctx.moveTo(fullW*.2,-fullH*.62);ctx.lineTo(fullW*1.05,-fullH*.62)}else{ctx.moveTo(fullW*.18,-fullH*.62);ctx.lineTo(fullW*.9,-fullH*.88)}ctx.stroke();ctx.restore()}ctx.restore()}
function goTitle(){state='title';game=null;show('title');titleMeta();music('menu',0)}
function menuInput(){pollGP();if(state==='title'&&(edge('punch')||edge('special')))gateStart(innerWidth/2,innerHeight/2);if(state==='select'){if(edge('left')){cursor=(cursor+roster.length-1)%roster.length;drawGrid()}if(edge('right')){cursor=(cursor+1)%roster.length;drawGrid()}if(edge('up')){cursor=(cursor+roster.length-3)%roster.length;drawGrid()}if(edge('crouch')){cursor=(cursor+3)%roster.length;drawGrid()}if(edge('punch'))choose(true)}else if(state==='vs'&&edge('punch'))begin.click();else if(state==='intro'&&(edge('punch')||edge('special')))finishIntro();if(state==='fight'&&edge('block'))togglePause();requestAnimationFrame(menuInput)}
function togglePause(){if(state==='fight'){state='paused';pause.classList.add('on');songs[curSong]?.pause()}else if(state==='paused'){state='fight';pause.classList.remove('on');songs[curSong]?.play().catch(()=>{})}}resume.onclick=togglePause;quit.onclick=()=>{pause.classList.remove('on');goTitle()};
const km={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',ArrowDown:'crouch',a:'left',d:'right',w:'jump',s:'crouch',x:'punch',X:'punch',j:'punch',J:'punch',c:'kick',C:'kick',k:'kick',K:'kick',Shift:'special',l:'special',L:'special',v:'block',V:'block',i:'block',I:'block'};addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){keys.punch=true;e.preventDefault()}else if(e.key==='Escape'||e.key==='p'||e.key==='P'){togglePause();return}else if(km[e.key]){keys[km[e.key]]=true;if(e.key.startsWith('Arrow'))e.preventDefault()}unlock()});addEventListener('keyup',e=>{if(e.key==='Enter'||e.key===' ')keys.punch=false;else if(km[e.key])keys[km[e.key]]=false});document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;unlock()});['pointerup','pointerleave','pointercancel'].forEach(q=>b.addEventListener(q,()=>keys[k]=false))});
function pollGP(){let ps=navigator.getGamepads?navigator.getGamepads():[];if(gpIndex===null){for(let p of ps)if(p){gpIndex=p.index;gp.classList.add('on');setTimeout(()=>gp.classList.remove('on'),2200);break}}let p=ps[gpIndex];if(!p)return;let B=i=>p.buttons[i]&&p.buttons[i].pressed;keys.left=(p.axes[0]||0)<-.4||B(14);keys.right=(p.axes[0]||0)>.4||B(15);keys.jump=(p.axes[1]||0)<-.4||B(12);keys.crouch=(p.axes[1]||0)>.4||B(13);keys.punch=B(0);keys.block=B(1)||B(4)||B(5);keys.kick=B(2);keys.special=B(3)}addEventListener('gamepadconnected',e=>{gpIndex=e.gamepad.index;unlock();gp.classList.add('on');setTimeout(()=>gp.classList.remove('on'),2200)});
makeSkull();preload();requestAnimationFrame(menuInput);
